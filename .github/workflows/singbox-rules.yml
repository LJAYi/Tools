name: Update Sing-box rules

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Convert upstream Clash rules
        run: python3 Singbox/build-rules.py
      - name: Commit changed rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Singbox/rules
          git diff --cached --quiet || git commit -m "chore: update sing-box rules"
          git push
