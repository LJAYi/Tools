美国负载均衡 = load-balance,policy-regex-filter=🇺🇸|🇺🇲|美国|波特兰|达拉斯|凤凰城|硅谷|洛杉矶|圣何塞|西雅图|芝加哥|\b(US|USA|United States)\d*\b,interval=60,timeout=5,url=http://www.gstatic.com/generate_204

兜底后备策略 = select,DIRECT,场景选择,全球故障转移,香港时延优选,台湾时延优选,日本时延优选,韩国时延优选,新国时延优选,美国时延优选,policy-select-name=场景选择

