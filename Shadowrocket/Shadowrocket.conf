# 手动节点池；自动匹配 Shadowrocket 中已有的订阅节点
大陆节点 = select,policy-regex-filter=^(?=.*(🇨🇳|回国|中国|上海|广州|北京|\b(CN|China)\d*\b))(?!.*(群|邀请|返利|官网|客服|订阅|流量|到期|过期|剩余|套餐|USE|USED|TOTAL|EXPIRE)).*$
香港节点 = select,policy-regex-filter=^(?=.*(🇭🇰|香港|\b(HK|HKG|Hong)\d*\b))(?!.*(回国|校园|游戏|🎮|GAME)).*$
台湾节点 = select,policy-regex-filter=^(?=.*(🇹🇼|台湾|台灣|\b(TW|TWN|Tai|Taiwan)\d*\b))(?!.*(回国|校园|游戏|🎮|GAME)).*$
日本节点 = select,policy-regex-filter=^(?=.*(🇯🇵|日本|川日|东京|大阪|泉日|埼玉|\b(JP|JPN|Japan)\d*\b))(?!.*(回国|校园|游戏|🎮|GAME)).*$
韩国节点 = select,policy-regex-filter=^(?=.*(🇰🇷|韩国|韓|首尔|\b(KR|KOR|Korea)\d*\b))(?!.*(回国|校园|游戏|🎮|GAME)).*$
新国节点 = select,policy-regex-filter=^(?=.*(🇸🇬|新加坡|狮城|\b(SG|SGP|Singapore)\d*\b))(?!.*(回国|校园|游戏|🎮|GAME)).*$
美国节点 = select,policy-regex-filter=^(?=.*(🇺🇸|🇺🇲|美国|波特兰|达拉斯|凤凰城|硅谷|洛杉矶|圣何塞|西雅图|芝加哥|\b(US|USA|United States)\d*\b))(?!.*(回国|校园|游戏|🎮|GAME)).*$
全球节点 = select,policy-regex-filter=^(?=.*.)(?!.*(群|邀请|返利|官网|客服|订阅|流量|到期|过期|剩余|套餐|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Traffic)).*$

# 时延优选
大陆时延优选 = url-test,policy-regex-filter=🇨🇳|回国|中国|上海|广州|北京|\b(CN|China)\d*\b,interval=60,tolerance=50,timeout=5,url=http://www.gstatic.com/generate_204
香港时延优选 = url-test,policy-regex-filter=🇭🇰|香港|\b(HK|HKG|Hong)\d*\b,interval=60,tolerance=50,timeout=5,url=http://www.gstatic.com/generate_204
台湾时延优选 = url-test,policy-regex-filter=🇹🇼|台湾|台灣|\b(TW|TWN|Tai|Taiwan)\d*\b,interval=60,tolerance=50,timeout=5,url=http://www.gstatic.com/generate_204
日本时延优选 = url-test,policy-regex-filter=🇯🇵|日本|川日|东京|大阪|泉日|埼玉|\b(JP|JPN|Japan)\d*\b,interval=60,tolerance=50,timeout=5,url=http://www.gstatic.com/generate_204
韩国时延优选 = url-test,policy-regex-filter=🇰🇷|韩国|韓|首尔|\b(KR|KOR|Korea)\d*\b,interval=60,tolerance=50,timeout=5,url=http://www.gstatic.com/generate_204
新国时延优选 = url-test,policy-regex-filter=🇸🇬|新加坡|狮城|\b(SG|SGP|Singapore)\d*\b,interval=60,tolerance=50,timeout=5,url=http://www.gstatic.com/generate_204
美国时延优选 = url-test,policy-regex-filter=🇺🇸|🇺🇲|美国|波特兰|达拉斯|凤凰城|硅谷|洛杉矶|圣何塞|西雅图|芝加哥|\b(US|USA|United States)\d*\b,interval=60,tolerance=50,timeout=5,url=http://www.gstatic.com/generate_204

# 故障转移
大陆故障转移 = fallback,policy-regex-filter=🇨🇳|回国|中国|上海|广州|北京|\b(CN|China)\d*\b,interval=60,timeout=5,url=http://www.gstatic.com/generate_204
香港故障转移 = fallback,policy-regex-filter=🇭🇰|香港|\b(HK|HKG|Hong)\d*\b,interval=60,timeout=5,url=http://www.gstatic.com/generate_204
