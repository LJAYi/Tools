# Generated from Loon/Loon_Configuration.lcf by scripts/build-loon-clash.rb
# Requires Mihomo; see Clash/Loon_Configuration.md for adaptation details.
---
mixed-port: 7890
port: 7222
socks-port: 7221
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: true
profile:
  store-selected: true
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  default-nameserver:
  - 223.5.5.5
  - 1.1.1.1
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
sniffer:
  enable: true
  sniff:
    TLS:
      ports:
      - 443
    HTTP:
      ports:
      - 80
      - 8080-8880
proxy-groups:
- name: 场景选择
