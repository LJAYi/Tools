  include-all: true
  filter: "(?i)\U0001F1FA\U0001F1F8|\U0001F1FA\U0001F1F2|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|\\b(US|USA|United
