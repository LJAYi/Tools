  include-all: true
  filter: ".+"
  exclude-filter: "(?i)群|邀请|返利|官网|客服|订阅|流量|到期|过期|已用|联系|邮箱|工单|教程|关注|更新|作者|超时|\\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Traffic)\\b"
  proxies:
  - 美国场景
  - 大陆场景
  - 香港场景
  - 日本场景
  - 新国场景
  - 全球场景
  - DIRECT
  icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png
- name: 美国场景
