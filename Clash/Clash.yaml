# Clash.Meta / Mihomo rule configuration

mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  default-nameserver: [223.5.5.5, 1.1.1.1]
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

proxy-groups:
  # include-all automatically includes locally added nodes and provider nodes.
  - { name: Proxy, type: select, proxies: [DIRECT], include-all: true }
  - { name: Final, type: select, proxies: [Proxy, DIRECT], include-all: true }
  - { name: Apple, type: select, proxies: [Proxy, DIRECT], include-all: true }
  - { name: BiliBili, type: select, proxies: [DIRECT, Proxy], include-all: true }
  - { name: Netflix, type: select, proxies: [Proxy, DIRECT], include-all: true }
  - { name: Disney, type: select, proxies: [Proxy, DIRECT], include-all: true }
  - { name: YouTube, type: select, proxies: [Proxy, DIRECT], include-all: true }
  - { name: TikTok, type: select, proxies: [Proxy, DIRECT], include-all: true }
  - { name: GlobalMedia, type: select, proxies: [Proxy, DIRECT], include-all: true }
  - { name: OpenAI, type: select, proxies: [Proxy, DIRECT], include-all: true }
  - { name: Claude, type: select, proxies: [Proxy, DIRECT], include-all: true }
  - { name: Gemini, type: select, proxies: [Proxy, DIRECT], include-all: true }
  - { name: Google, type: select, proxies: [Proxy, DIRECT], include-all: true }
  - { name: GitHub, type: select, proxies: [Proxy, DIRECT], include-all: true }
  - { name: Microsoft, type: select, proxies: [Proxy, DIRECT], include-all: true }
  - { name: PayPal, type: select, proxies: [Proxy, DIRECT], include-all: true }
  - { name: Telegram, type: select, proxies: [Proxy, DIRECT], include-all: true }
  - { name: Steam, type: select, proxies: [Proxy, DIRECT], include-all: true }
  - { name: Lan, type: select, proxies: [DIRECT, Proxy], include-all: true }
  - { name: China, type: select, proxies: [DIRECT, Proxy], include-all: true }

x-rule-provider: &rule-provider
  type: http
  behavior: classical
  interval: 86400

rule-providers:
  WeChat:
    <<: *rule-provider
    url: https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/WeChat/WeChat_No_Resolve.yaml
    path: ./ruleset/WeChat.yaml
